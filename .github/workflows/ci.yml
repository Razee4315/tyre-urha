name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
  pull_request:

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run doctor
        run: npm run doctor

      - name: Run bootstrap
        run: npm run bootstrap

      - name: Build web app
        run: npm run build

      - name: Check Rust app
        run: cargo check --manifest-path src-tauri/Cargo.toml
