def cargoHomePath = System.getenv("CARGO_HOME") ?: new File(System.getProperty("user.home"), ".cargo").absolutePath
def registrySrcDir = new File(cargoHomePath, "registry/src")

def resolveCargoCrateDir(String prefix, String suffix = "") {
    if (!registrySrcDir.exists()) {
        throw new GradleException("Cargo registry not found at ${registrySrcDir}. Run `npm run android:prepare` first.")
    }

    def matches = registrySrcDir.listFiles()
        ?.findAll { it.isDirectory() }
        ?.collectMany { sourceDir ->
            sourceDir.listFiles()?.findAll { it.isDirectory() && it.name.startsWith(prefix) } ?: []
        }
        ?.sort { left, right -> right.name <=> left.name } ?: []

    if (matches.isEmpty()) {
        throw new GradleException("Could not find Cargo crate `${prefix}` under ${registrySrcDir}. Run `npm run android:prepare` first.")
    }

    return suffix ? new File(matches.first(), suffix) : matches.first()
}

include ':tauri-android'
project(':tauri-android').projectDir = resolveCargoCrateDir('tauri-', 'mobile/android')
