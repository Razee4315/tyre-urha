name: Android Release

# Auto-bumps the patch version on every push to main, builds the Android
# APK + AAB, and publishes them to a new GitHub release tagged vX.Y.Z.
#
# ─── ONE-TIME SETUP ───────────────────────────────────────────────────────────
# 1. Repo → Settings → Actions → General → Workflow permissions: Read and write
# 2. Repo → Settings → Secrets and variables → Actions, add:
#      ANDROID_KEYSTORE_BASE64   base64-encoded .keystore file
#      ANDROID_KEY_ALIAS         key alias
#      ANDROID_KEY_PASSWORD      key password
#      ANDROID_STORE_PASSWORD    keystore store password
# Without those secrets the build still runs but produces a debug-signed APK.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Cancel any in-flight run for the same ref when a new push lands.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Auto-bump patch version ────────────────────────────────────────
  check-and-bump:
    name: Version check and bump
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes and bump version
        id: bump
        run: |
          CURRENT_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "Current version: $CURRENT_VERSION"

          if git tag -l "v$CURRENT_VERSION" | grep -q "v$CURRENT_VERSION"; then
            echo "Tag v$CURRENT_VERSION exists"
            COMMITS_SINCE=$(git rev-list "v$CURRENT_VERSION"..HEAD --count 2>/dev/null || echo "0")
            echo "Commits since tag: $COMMITS_SINCE"

            if [ "$COMMITS_SINCE" -eq "0" ]; then
              echo "Nothing new — skipping release"
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
              exit 0
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "Bumping: $CURRENT_VERSION → $NEW_VERSION"

            jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
            jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
            jq --arg v "$NEW_VERSION" '.version = $v' template.config.json > tmp.json && mv tmp.json template.config.json
            sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src-tauri/tauri.conf.json package.json template.config.json src-tauri/Cargo.toml
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
            git push

            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "No tag for v$CURRENT_VERSION — first release"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  # ─── Job 2: Android build + release ────────────────────────────────────────
  release-android:
    name: Release Android (APK + AAB)
    needs: check-and-bump
    if: needs.check-and-bump.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository (post-bump)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        env:
          NDK_VERSION: 29.0.13113456
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Install the `cargo-tauri` binary (Gradle's Rust plugin shells out to
      # `cargo tauri ...`). taiki-e/install-action fetches a prebuilt binary
      # in seconds, replacing a ~5min `cargo install` from-source build.
      - name: Install Tauri CLI (cargo binary)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Setup signing files from secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ] || [ -z "${ANDROID_STORE_PASSWORD}" ]; then
            echo "Signing secrets not configured. Continuing without CI keystore injection."
            exit 0
          fi
          mkdir -p signing
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > signing/release.keystore
          # storeFile is resolved by Gradle from the app module directory
          # (src-tauri/gen/android/app/), so reach the repo-root signing/ dir
          # with four `..` segments.
          cat <<EOF > src-tauri/gen/android/keystore.properties
          storeFile=../../../../signing/release.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Run bootstrap
        run: npm run bootstrap

      - name: Build Android APK + AAB (aarch64)
        run: npm run android:build -- --target aarch64

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ needs.check-and-bump.outputs.version }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
            src-tauri/gen/android/app/build/outputs/**/output-metadata.json
          if-no-files-found: error

      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.check-and-bump.outputs.version }}

          # Slug derived from the productName in template.config.json so the
          # release artifacts reflect the renamed app rather than the
          # template's original "TauriAndroidTemplate" placeholder.
          PRODUCT_NAME=$(jq -r '.productName' template.config.json)
          SLUG=$(echo "$PRODUCT_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')

          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          AAB=$(find src-tauri/gen/android -name "*.aab" -type f | head -1)

          if ! gh release view "v$VERSION" &>/dev/null; then
            echo "Creating release v$VERSION"
            gh release create "v$VERSION" \
              --title "$PRODUCT_NAME v$VERSION" \
              --generate-notes \
              --target main
          fi

          if [ -n "$APK" ]; then
            cp "$APK" "${SLUG}-${VERSION}.apk"
            gh release upload "v$VERSION" "${SLUG}-${VERSION}.apk" --clobber
          fi

          if [ -n "$AAB" ]; then
            cp "$AAB" "${SLUG}-${VERSION}.aab"
            gh release upload "v$VERSION" "${SLUG}-${VERSION}.aab" --clobber
          fi
